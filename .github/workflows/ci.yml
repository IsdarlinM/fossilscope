name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SRIC_CORE_CI_REF: 77e954f2230aab1416f6792cb1670c22d57ee03c

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./sric-core
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff mypy build pip-audit hypothesis httpx
      - name: Every public CLI command functional smoke
        run: python -m pytest -q tests/e2e/test_cli_all_commands_functional.py
      - run: python -m sric.standalone_gate --root .
      - run: python scripts/release-gate.py --quick

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IsdarlinM/sric-core
          ref: ${{ env.SRIC_CORE_CI_REF }}
          path: sric-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux install/uninstall preservation smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          SRIC_CORE_SOURCE: ${{ github.workspace }}/sric-core
        run: |
          TEST_HOME="${RUNNER_TEMP}/fossilscope-home"
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" sh scripts/install-linux.sh
          "$TEST_HOME/.fossilscope/venv/bin/fossilscope" init preserve
          HOME="$TEST_HOME" sh scripts/uninstall-linux.sh
          test -f "$TEST_HOME/.fossilscope/workspaces/preserve/workspace.json"
      - name: Windows corruption, repair, uninstall, and data-preservation smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'fossilscope-home'
          $env:SRIC_CORE_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'sric-core'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          cmd /c scripts\install-windows.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "$env:USERPROFILE\.fossilscope\venv\Scripts\fossilscope.exe"
          $python = "$env:USERPROFILE\.fossilscope\venv\Scripts\python.exe"
          & $exe init preserve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip uninstall -y annotated-types
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe version
          if ($LASTEXITCODE -eq 0) { throw 'Corruption fixture did not break FossilScope as expected.' }
          cmd /c scripts\repair-windows.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "$env:USERPROFILE\.fossilscope\venv\Scripts\fossilscope.exe"
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:USERPROFILE\.fossilscope\workspaces\preserve\workspace.json")) {
            throw 'Workspace was not preserved across runtime repair.'
          }
          if (Test-Path "$env:USERPROFILE\.fossilscope\venv.rollback") {
            throw 'Runtime rollback directory was not cleaned after successful repair.'
          }
          cmd /c scripts\uninstall-windows.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$env:USERPROFILE\.fossilscope\venv") { throw 'runtime venv was not removed' }
          if (-not (Test-Path "$env:USERPROFILE\.fossilscope\workspaces\preserve\workspace.json")) { throw 'workspace data was removed' }
