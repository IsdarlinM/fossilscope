[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"

[project]
name="fossilscope"
version="0.5.16"
description="Temporal security graph and attack-surface archaeology."
readme="README.md"
requires-python=">=3.11"
license="Apache-2.0"
authors=[{name="imr"}]
dependencies=[
  "fastapi>=0.128,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "sric-core>=0.5.16,<0.6",
]

[project.optional-dependencies]
dev=[
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "build>=1,<2",
  "pip-audit>=2,<3",
  "hypothesis>=6,<7",
]

[project.scripts]
fossilscope="fossilscope.cli_all:run"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
addopts="-q"
testpaths=["tests"]

[tool.ruff]
line-length=100
target-version="py311"

[tool.mypy]
python_version="3.11"
strict=true
packages=["fossilscope"]

[tool.setuptools.package-data]
fossilscope=["py.typed"]
